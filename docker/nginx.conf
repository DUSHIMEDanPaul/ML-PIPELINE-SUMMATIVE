# ---------------------------------------------------------------------------
# nginx as a load balancer in front of the (scalable) `api` service.
#
# Why this exists: when you run `docker compose up --scale api=N`, all N
# replicas listen on container port 8000, but only ONE host port can be
# published. nginx takes the single published port 8000 and fans requests out
# across the replicas.
#
# The `resolver` + variable `proxy_pass` pattern forces nginx to re-resolve the
# `api` service name via Docker's embedded DNS (127.0.0.11) at request time, so
# it picks up replicas added/removed by --scale without a restart and
# round-robins across them.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Allow reasonably large image / zip uploads through the proxy.
    client_max_body_size 25m;

    # Docker's embedded DNS server; short TTL so scaling changes are seen fast.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long read timeout: /predict can take a moment on a cold CPU model, and a
    # queued upload should not be cut off. (Retrain itself is async, so it
    # returns immediately and is NOT held open here.)
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    server {
        listen 8000;

        location / {
            # Using a variable makes proxy_pass honour the resolver above.
            set $api_backend "api:8000";
            proxy_pass http://$api_backend$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
